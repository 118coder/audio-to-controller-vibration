name: build-windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install XInput-Python pyaudio numpy scipy matplotlib psutil pyinstaller

      - name: Build windowed exe
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name AudioVibration main.py

      - name: Build console exe (diagnostics)
        run: |
          pyinstaller --noconfirm --onefile --console --name AudioVibration_console main.py

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item dist/AudioVibration.exe package/
          Copy-Item dist/AudioVibration_console.exe package/
          Copy-Item -Recurse -Force config package/
          Copy-Item default_config.json package/
          Compress-Archive -Path package/* -DestinationPath AudioVibration_windows.zip -Force
          Get-ChildItem package | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AudioVibration_windows
          path: AudioVibration_windows.zip
          retention-days: 30

      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: AudioVibration_windows.zip
          body: "音频转手柄震动 Windows 版（PyInstaller 云端构建）"
